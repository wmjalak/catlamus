name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  prowl:
    name: Install, check and package
    runs-on: macos-latest

    steps:
      - name: Check out the litter
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Package the app
        # --publish never: electron-builder otherwise detects CI and tries to
        # publish to a GitHub release, which needs a token we do not want here.
        run: npm run build -- --publish never

      - name: Upload the dmg
        uses: actions/upload-artifact@v7
        with:
          name: catlamus-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
