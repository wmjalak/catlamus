name: 🙀 Bug report
description: Something in Catlamus coughed up a hairball.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for prowling by. A few details help us corner the bug.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a folder with ...
        2. Press ⌘F and ...
        3. See the hairball
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Catlamus version
      description: See the version in `package.json`, or the About panel.
      placeholder: "1.3.1"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.0 (arm64)"
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Anything from the DevTools console or the terminal. Pasted here, it is formatted automatically.
      render: shell
